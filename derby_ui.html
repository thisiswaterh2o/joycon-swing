<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Home Run Derby</title>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600&family=Oswald:wght@400;500&display=swap" rel="stylesheet">
<style>
  html, body { height:100%; margin:0; }
  body { font-family:'Oswald', sans-serif; background:#12100C; color:#F5F1E8; width:100vw; height:100vh; max-width:none; padding:20px 24px; box-sizing:border-box; display:flex; flex-direction:column; }
  button { cursor:pointer; font-family:'Oswald', sans-serif; text-transform:uppercase; letter-spacing:0.05em; font-size:13px; }
  h2 { font-family:'Teko', sans-serif; font-weight:600; font-size:32px; letter-spacing:0.02em; text-transform:uppercase; color:#F5F1E8; margin:0 0 0.5rem; flex-shrink:0; }

  .preset-btn { flex:1; padding:10px; background:#3E2723; color:#E8DCC8; border:1px solid #5C4033; border-radius:3px; }
  .preset-btn.active { background:#0B3D2E; border-color:#639922; color:#EAF3DE; }

  #status { font-size:12px; color:#8A7D6B; margin-top:8px; text-align:center; flex-shrink:0; }

  body.fs-mode { padding:0; }
  body.fs-mode #field-wrap { position:fixed; inset:0; width:100vw; height:100vh; border:none; border-radius:0; z-index:1; margin:0; }
  body.fs-mode h2 { position:fixed; top:16px; left:20px; z-index:3; font-size:22px; margin:0; background:rgba(10,10,8,0.45); padding:4px 12px; border-radius:4px; }
  body.fs-mode #controls-row { position:fixed; top:16px; right:20px; z-index:3; margin:0; background:rgba(10,10,8,0.45); padding:6px; border-radius:6px; width:auto; }
  body.fs-mode #controls-row .preset-btn { padding:6px 10px; font-size:11px; }
  body.fs-mode #status { position:fixed; top:104px; left:20px; z-index:3; background:rgba(10,10,8,0.45); padding:4px 12px; border-radius:4px; }
  body.fs-mode #scoreboard { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:3; width:min(90vw,460px); background:rgba(11,10,8,0.78); }
  body.fs-mode #leaderboard-panel { position:fixed; top:62px; left:20px; z-index:3; background:rgba(10,10,8,0.55); padding:4px 12px; border-radius:4px; margin:0; }

  #scoreboard { background:#0B0A08; border:3px solid #2C2C2A; border-radius:4px; padding:1.25rem 1rem; text-align:center; flex-shrink:0; }
  #outcome-label { font-family:'Teko', sans-serif; font-size:20px; font-weight:600; letter-spacing:0.1em; margin-bottom:4px; color:#8A7D6B; text-transform:uppercase; }
  #distance-readout { font-family:'Teko', sans-serif; font-size:56px; font-weight:600; letter-spacing:0.03em; color:#FAC775; text-shadow:0 0 12px rgba(250,199,117,0.4); line-height:1; }
  #detail-label { font-size:11px; color:#6B6155; margin-top:8px; text-transform:uppercase; letter-spacing:0.04em; }

  #field-wrap { position:relative; width:100%; flex:1 1 auto; min-height:200px; margin:0 0 1rem; border:3px solid #2C2C2A; border-radius:4px; overflow:hidden; background:#7FB3E0; }
  #field-canvas { display:block; width:100%; height:100%; }

  #leaderboard-panel { font-size:11px; color:#B7AC98; margin-top:6px; flex-shrink:0; }
  #leaderboard-panel b { color:#FAC775; }

  #hud { position:absolute; left:14px; bottom:14px; z-index:4; display:flex; gap:14px; align-items:flex-end; pointer-events:none; }
  .hud-block { background:rgba(9,9,7,0.62); border:1px solid rgba(250,199,117,0.28); border-radius:5px; padding:7px 9px; }
  .hud-label { font-size:9.5px; letter-spacing:0.14em; text-transform:uppercase; color:#9C927F; margin-bottom:5px; }
  #hud-zone, #hud-timing { display:block; }
  #hud-timing-text { font-size:10px; letter-spacing:0.06em; text-transform:uppercase; color:#B7AC98; margin-top:4px; text-align:center; }
</style>
</head>
<body>

<h2>Home Run Derby</h2>

<div style="display:flex; gap:8px; margin-bottom:1rem; flex-shrink:0;" id="controls-row">
  <button class="preset-btn" id="btn-easy">Easy</button>
  <button class="preset-btn" id="btn-medium">Medium</button>
  <button class="preset-btn" id="btn-hard">Hard</button>
  <button class="preset-btn" id="btn-sound" style="flex:0 0 130px;">Enable sound</button>
  <button class="preset-btn" id="btn-hand" style="flex:0 0 110px;">Bats: right</button>
  <button class="preset-btn" id="btn-recenter" style="flex:0 0 110px;">Recenter bat</button>
  <button class="preset-btn" id="btn-quality" style="flex:0 0 130px;">Quality: high</button>
  <button class="preset-btn" id="btn-fullscreen" style="flex:0 0 110px;">Fullscreen</button>
</div>

<div id="field-wrap">
  <canvas id="field-canvas"></canvas>
  <div id="hud">
    <div class="hud-block">
      <div class="hud-label">Pitch location</div>
      <canvas id="hud-zone" width="132" height="132"></canvas>
    </div>
    <div class="hud-block">
      <div class="hud-label">Swing timing</div>
      <canvas id="hud-timing" width="230" height="56"></canvas>
      <div id="hud-timing-text">—</div>
    </div>
  </div>
</div>

<div id="leaderboard-panel">Session best: <b id="session-best">---</b> &nbsp;|&nbsp; Home runs: <b id="session-hrs">0</b></div>

<div id="status">Connecting to ws://localhost:8765 ...</div>

<div id="scoreboard" style="margin-top:1rem;">
  <div id="outcome-label">Ready</div>
  <div id="distance-readout">---</div>
  <div id="detail-label">tap ZR on the right joy-con to call for a pitch</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =========================================================================
   DIFFICULTY / TIMING
   ========================================================================= */
var PRESETS = { easy:{speed:55, window:220}, medium:{speed:75, window:140}, hard:{speed:95, window:80} };
var CALIB_FLOOR = 785;
var CALIB_CEIL = 2433;
var BASE_SPEED_MPH = 75;
var BASE_IDEAL_CONTACT_MS = 1600;

function effectiveIdealContactMs(speedMph){
  return BASE_IDEAL_CONTACT_MS * (BASE_SPEED_MPH / speedMph);
}

/* =========================================================================
   SCENE SCALE — real feet.
   ========================================================================= */
var FT_PER_M = 3.28084;
var M_PER_FT = 0.3048;

var MOUND_Z = -60.5;
var PLATE_Z = 1.5;
/* Real MLB strike zone: 17in plate width plus a ball's width on each side
   for the called zone (~1.42ft of plate, ~1.66ft effective), running from
   roughly the hollow beneath the kneecap to the midpoint of the torso. */
var ZONE_W_FT = 1.66;
var ZONE_BOTTOM_FT = 1.60;
var ZONE_TOP_FT = 3.42;
var ZONE_H_FT = ZONE_TOP_FT - ZONE_BOTTOM_FT;
var ZONE_CENTER_Y = (ZONE_TOP_FT + ZONE_BOTTOM_FT) / 2;
var ZONE_CELL_W = ZONE_W_FT / 3;
var ZONE_CELL_H = ZONE_H_FT / 3;

/* Pitcher release: ~54ft from the plate (stride off the rubber), around
   5.8ft up and offset to the arm side. */
var RELEASE_Z = MOUND_Z + 6.5;
var RELEASE_Y = 5.8;
var RELEASE_X = -1.6;
var BALL_RADIUS_FT = 0.121;
var BASE_PATH_FT = 90;

var ZONES = [
  {id:'tl', row:0, col:0, tier:'corner', windowMult:0.65, payoutMult:1.3},
  {id:'tm', row:0, col:1, tier:'edge',   windowMult:1.0,  payoutMult:1.0},
  {id:'tr', row:0, col:2, tier:'corner', windowMult:0.65, payoutMult:1.3},
  {id:'ml', row:1, col:0, tier:'edge',   windowMult:1.0,  payoutMult:1.0},
  {id:'cc', row:1, col:1, tier:'center', windowMult:1.3,  payoutMult:0.85},
  {id:'mr', row:1, col:2, tier:'edge',   windowMult:1.0,  payoutMult:1.0},
  {id:'bl', row:2, col:0, tier:'corner', windowMult:0.65, payoutMult:1.3},
  {id:'bm', row:2, col:1, tier:'edge',   windowMult:1.0,  payoutMult:1.0},
  {id:'br', row:2, col:2, tier:'corner', windowMult:0.65, payoutMult:1.3}
];

function zoneWorldPos(zone){
  var x = (zone.col - 1) * ZONE_CELL_W;
  var y = ZONE_CENTER_Y + (1 - zone.row) * ZONE_CELL_H;
  return {x:x, y:y, z:PLATE_Z};
}

/* Pick an actual point inside the chosen cell rather than always aiming at
   its exact center — real pitches scatter within a target region, and this
   makes the HUD's plotted location meaningful instead of a fixed 9 dots. */
function zoneTargetPoint(zone){
  var c = zoneWorldPos(zone);
  return {
    x: c.x + (Math.random() - 0.5) * ZONE_CELL_W * 0.72,
    y: c.y + (Math.random() - 0.5) * ZONE_CELL_H * 0.72,
    z: PLATE_Z
  };
}

var state = { pitching:false, hitting:false, pitchStartLocal:0, currentZone:ZONES[4], preset:'medium',
              idealContactMs:BASE_IDEAL_CONTACT_MS, travelMs:BASE_IDEAL_CONTACT_MS*2,
              cameraMode:'batter', quality:'high',
              pitchPlan:null, pitchTarget:null, windupMs:0 };

var outcomeLabel = document.getElementById('outcome-label');
var distanceReadout = document.getElementById('distance-readout');
var detailLabel = document.getElementById('detail-label');
var statusEl = document.getElementById('status');
var sessionBestEl = document.getElementById('session-best');
var sessionHrsEl = document.getElementById('session-hrs');
var btns = { easy:document.getElementById('btn-easy'), medium:document.getElementById('btn-medium'), hard:document.getElementById('btn-hard') };

var sessionBestFt = 0;
var sessionHRs = 0;

/* =========================================================================
   OUTFIELD WALL CONTOUR
   ========================================================================= */
var FOUL_LINE_FT = 330;
var CENTER_FT = 400;
var WALL_HEIGHT_FT = 8;
var WALL_ANGLE_RANGE = 45;

function wallDistanceAtAngle(angleDeg){
  var t = Math.max(-1, Math.min(1, angleDeg / WALL_ANGLE_RANGE));
  var curve = 1 - Math.pow(Math.abs(t), 1.8);
  return FOUL_LINE_FT + (CENTER_FT - FOUL_LINE_FT) * curve;
}

/* =========================================================================
   PROJECTILE PHYSICS — flight (drag + Magnus), then ground bounces with
   restitution + friction, then a rolling phase, plus wall caroms.
   ========================================================================= */
var GRAVITY = 9.81;
var AIR_DENSITY = 1.225;
var BALL_MASS_KG = 0.145;
var BALL_RADIUS_M = 0.0369;
var BALL_AREA = Math.PI * BALL_RADIUS_M * BALL_RADIUS_M;
var DRAG_CD = 0.40;
var CONTACT_HEIGHT_FT = 3.0;
var DT = 0.01;

// Bounce / roll tuning (grass)
var COR_GROUND = 0.38;      // vertical restitution off turf
var FRICTION_GROUND = 0.55; // horizontal scrub per bounce
var COR_WALL = 0.40;        // carom off the outfield wall
var ROLL_DECEL = 6.5;       // m/s^2 rolling deceleration through grass
var MIN_BOUNCE_MS = 1.2;    // below this vertical speed, transition to roll

function simulateTrajectory(exitVeloMph, launchAngleDeg, sprayAngleDeg, backspinRpm, contactHeightFt){
  var h0 = (contactHeightFt === undefined) ? CONTACT_HEIGHT_FT : contactHeightFt;
  var v0 = exitVeloMph * 0.44704;
  var theta = launchAngleDeg * Math.PI / 180;
  var phi = sprayAngleDeg * Math.PI / 180;

  var vel = {
    x: v0 * Math.cos(theta) * Math.sin(phi),
    y: v0 * Math.sin(theta),
    z: -v0 * Math.cos(theta) * Math.cos(phi)
  };
  var pos = { x:0, y: h0 * M_PER_FT, z:0 };
  var omega = backspinRpm * 2 * Math.PI / 60;

  var points = [{ t:0, x:0, y:h0, z:0 }];
  var bounceEvents = [];
  var t = 0;
  var apexFt = h0;
  var bounces = 0;
  var rolling = false;
  var flightEndIdx = null;
  var carryFt = 0;
  var hitWall = false;
  var clearsWall = false;
  var wallChecked = false;
  var wallRadius = null;
  var wallHitPoint = null;

  for (var i = 0; i < 6000; i++){
    var speed = Math.sqrt(vel.x*vel.x + vel.y*vel.y + vel.z*vel.z);
    if (speed < 0.005) speed = 0.005;

    if (!rolling){
      var dragCoeff = 0.5 * AIR_DENSITY * DRAG_CD * BALL_AREA * speed / BALL_MASS_KG;
      var ax = -dragCoeff * vel.x;
      var ay = -dragCoeff * vel.y - GRAVITY;
      var az = -dragCoeff * vel.z;
      var spinFactor = (BALL_RADIUS_M * omega) / speed;
      var liftCoeff = spinFactor > 0 ? 1 / (2 + 1/spinFactor) : 0;
      var liftAccel = (0.5 * AIR_DENSITY * liftCoeff * BALL_AREA * speed * speed) / BALL_MASS_KG;
      ay += liftAccel * 0.55;
      vel.x += ax * DT; vel.y += ay * DT; vel.z += az * DT;
    } else {
      var hs = Math.sqrt(vel.x*vel.x + vel.z*vel.z);
      if (hs > 0.01){
        var ns = Math.max(0, hs - ROLL_DECEL * DT);
        var k = ns / hs;
        vel.x *= k; vel.z *= k;
      }
      vel.y = 0;
    }

    pos.x += vel.x * DT; pos.y += vel.y * DT; pos.z += vel.z * DT;
    t += DT;

    var xf = pos.x * FT_PER_M, yf = pos.y * FT_PER_M, zf = pos.z * FT_PER_M;
    if (yf > apexFt) apexFt = yf;

    var distFt = Math.sqrt(xf*xf + zf*zf);
    var angDeg = Math.atan2(xf, -zf) * 180 / Math.PI;
    if (wallRadius === null && Math.abs(angDeg) <= WALL_ANGLE_RANGE){
      wallRadius = wallDistanceAtAngle(angDeg);
    }
    var wr = wallRadius !== null ? wallRadius : wallDistanceAtAngle(Math.max(-45, Math.min(45, angDeg)));

    // Wall interaction — clear it, or carom back into play.
    if (!wallChecked && distFt >= wr && Math.abs(angDeg) <= WALL_ANGLE_RANGE){
      wallChecked = true;
      if (yf > WALL_HEIGHT_FT){
        clearsWall = true;
      } else {
        hitWall = true;
        wallHitPoint = { x: xf, y: yf, z: zf, t: t };
        var nx = xf / distFt, nz = zf / distFt;
        var vr = vel.x * nx + vel.z * nz;
        vel.x -= (1 + COR_WALL) * vr * nx;
        vel.z -= (1 + COR_WALL) * vr * nz;
        vel.y *= 0.6;
        pos.x = (wr - 1.5) * nx * M_PER_FT;
        pos.z = (wr - 1.5) * nz * M_PER_FT;
        xf = pos.x * FT_PER_M; zf = pos.z * FT_PER_M;
      }
    }

    // Ground contact — bounce, then eventually roll.
    if (pos.y <= 0 && !rolling){
      pos.y = 0; yf = 0;
      if (flightEndIdx === null){
        flightEndIdx = points.length;
        carryFt = Math.sqrt(xf*xf + zf*zf);
      }
      bounces++;
      var impactSpeed = Math.abs(vel.y);
      bounceEvents.push({ t:t, x:xf, z:zf, strength: Math.min(1, impactSpeed / 12) });
      if (impactSpeed < MIN_BOUNCE_MS || bounces > 6){
        rolling = true; vel.y = 0;
      } else {
        vel.y = -vel.y * COR_GROUND;
        vel.x *= FRICTION_GROUND;
        vel.z *= FRICTION_GROUND;
        omega *= 0.4;
      }
    }

    points.push({ t:t, x:xf, y:yf, z:zf });

    if (rolling && Math.sqrt(vel.x*vel.x + vel.z*vel.z) < 0.15) break;
    if (t > 18) break;
  }

  var last = points[points.length - 1];
  var totalFt = Math.sqrt(last.x*last.x + last.z*last.z);
  if (flightEndIdx === null){ flightEndIdx = points.length - 1; carryFt = totalFt; }
  var landingAngleDeg = Math.atan2(last.x, -last.z) * 180 / Math.PI;

  return {
    points: points,
    bounceEvents: bounceEvents,
    hangTimeSec: points[flightEndIdx].t,
    totalTimeSec: t,
    apexFt: apexFt,
    carryFt: Math.round(carryFt),
    totalDistanceFt: Math.round(totalFt),
    landingAngleDeg: landingAngleDeg,
    bounces: bounces,
    clearsWall: clearsWall,
    hitWall: hitWall,
    wallHitPoint: wallHitPoint,
    wallDistanceFt: Math.round(wallRadius !== null ? wallRadius : CENTER_FT)
  };
}

function positionOnTrajectory(traj, elapsedSec){
  var pts = traj.points;
  if (elapsedSec <= 0) return pts[0];
  if (elapsedSec >= pts[pts.length-1].t) return pts[pts.length - 1];
  for (var i = 1; i < pts.length; i++){
    if (pts[i].t >= elapsedSec){
      var a = pts[i-1], b = pts[i];
      var span = b.t - a.t;
      var f = span > 0 ? (elapsedSec - a.t) / span : 0;
      return { x: a.x + (b.x-a.x)*f, y: a.y + (b.y-a.y)*f, z: a.z + (b.z-a.z)*f, t: elapsedSec };
    }
  }
  return pts[pts.length - 1];
}

/* =========================================================================
   RENDERER — day game, tone mapped, soft shadows
   ========================================================================= */
var canvas = document.getElementById('field-canvas');
var fieldWrap = document.getElementById('field-wrap');
var renderer = new THREE.WebGLRenderer({ canvas:canvas, antialias:true, alpha:false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.92;

var scene = new THREE.Scene();
scene.background = new THREE.Color(0x86BCE4);
scene.fog = new THREE.Fog(0xA9CBE4, 380, 1100);

var camera = new THREE.PerspectiveCamera(58, 1, 0.1, 2500);
// Lower and further back than a pure batter's-eye view — sits behind and
// slightly off the batter's shoulder so plate, mound, and bat are all in
// frame at once. Updated per-handedness in setHandedness().
var BATTER_CAM_POS = new THREE.Vector3(0, 5.6, 19);
var BATTER_CAM_LOOK = new THREE.Vector3(0, 3.0, -30);
camera.position.copy(BATTER_CAM_POS);
var currentLook = new THREE.Vector3().copy(BATTER_CAM_LOOK);
camera.lookAt(currentLook);

function resizeRenderer(){
  var w = fieldWrap.clientWidth, h = fieldWrap.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resizeRenderer);

/* ---- Sky dome ---- */
var skyGeo = new THREE.SphereGeometry(1600, 32, 16);
var skyCanvas = document.createElement('canvas');
skyCanvas.width = 16; skyCanvas.height = 256;
var skyCtx = skyCanvas.getContext('2d');
var skyGrad = skyCtx.createLinearGradient(0, 0, 0, 256);
skyGrad.addColorStop(0.0, '#3E7FC1');
skyGrad.addColorStop(0.45, '#7FB3E0');
skyGrad.addColorStop(0.75, '#B8D8EF');
skyGrad.addColorStop(1.0, '#DCEAF5');
skyCtx.fillStyle = skyGrad;
skyCtx.fillRect(0, 0, 16, 256);
var skyTex = new THREE.CanvasTexture(skyCanvas);
var sky = new THREE.Mesh(skyGeo, new THREE.MeshBasicMaterial({ map:skyTex, side:THREE.BackSide, fog:false, depthWrite:false }));
scene.add(sky);

/* ---- Lighting: sun key + sky fill + bounce ---- */
var hemi = new THREE.HemisphereLight(0x9EC2E0, 0x46602E, 0.42);
scene.add(hemi);

var sun = new THREE.DirectionalLight(0xFFF1D4, 1.55);
sun.position.set(180, 340, 140);
sun.castShadow = true;
sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;
sun.shadow.camera.near = 50;
sun.shadow.camera.far = 900;
sun.shadow.camera.left = -260;
sun.shadow.camera.right = 260;
sun.shadow.camera.top = 260;
sun.shadow.camera.bottom = -260;
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.4;
scene.add(sun);
scene.add(sun.target);
sun.target.position.set(0, 0, -160);

var bounceLight = new THREE.DirectionalLight(0x9FBF7A, 0.28);
bounceLight.position.set(-120, 40, 80);
scene.add(bounceLight);

/* =========================================================================
   FIELD TEXTURES — mown grass with alternating radial stripes + noise
   ========================================================================= */
function makeGrassTexture(){
  var size = 1024;
  var c = document.createElement('canvas');
  c.width = size; c.height = size;
  var ctx = c.getContext('2d');
  var cx = size/2, cy = size/2;

  ctx.fillStyle = '#4E8A32';
  ctx.fillRect(0, 0, size, size);

  // Alternating mown wedges radiating from home plate (canvas center)
  var wedges = 18;
  for (var i = 0; i < wedges; i++){
    if (i % 2 === 0) continue;
    var a0 = (i / wedges) * Math.PI * 2;
    var a1 = ((i+1) / wedges) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, size, a0, a1);
    ctx.closePath();
    ctx.fillStyle = '#57993A';
    ctx.fill();
  }

  // Concentric mow arcs for cross-cut depth
  for (var r = 60; r < size; r += 78){
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI*2);
    ctx.strokeStyle = 'rgba(255,255,255,0.045)';
    ctx.lineWidth = 30;
    ctx.stroke();
  }

  // Fine grain noise
  var img = ctx.getImageData(0, 0, size, size);
  var d = img.data;
  for (var p = 0; p < d.length; p += 4){
    var n = (Math.random() - 0.5) * 22;
    d[p] = Math.max(0, Math.min(255, d[p] + n));
    d[p+1] = Math.max(0, Math.min(255, d[p+1] + n));
    d[p+2] = Math.max(0, Math.min(255, d[p+2] + n));
  }
  ctx.putImageData(img, 0, 0);

  var tex = new THREE.CanvasTexture(c);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  tex.encoding = THREE.sRGBEncoding;
  return tex;
}

function makeDirtTexture(){
  var size = 512;
  var c = document.createElement('canvas');
  c.width = size; c.height = size;
  var ctx = c.getContext('2d');
  ctx.fillStyle = '#9C6238';
  ctx.fillRect(0, 0, size, size);
  for (var i = 0; i < 2600; i++){
    var x = Math.random()*size, y = Math.random()*size;
    var r = Math.random()*4 + 1;
    var shade = Math.random() > 0.5 ? 'rgba(120,72,40,0.35)' : 'rgba(190,140,96,0.30)';
    ctx.fillStyle = shade;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
  }
  var tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(6, 6);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  tex.encoding = THREE.sRGBEncoding;
  return tex;
}

var batState = { hand:'right', swinging:false, swingStart:0, swingDur:260,
                 liveMotion:false, lastMotionAt:0 };

/* Live orientation integrated from the Joy-Con gyro. The bat mirrors the
   controller rather than playing a scripted arc, so the on-screen swing
   matches whatever you actually did with your hands.
   AXIS_MAP converts Joy-Con gyro axes into scene axes — if the bat pivots
   around the wrong axis for how you hold it, swap/negate here. */
var motionQuat = new THREE.Quaternion();
var restQuat = new THREE.Quaternion();
var tmpQuat = new THREE.Quaternion();
var tmpAxis = new THREE.Vector3();
var MOTION_GAIN = 1.0;

function axisMap(gx, gy, gz){
  // Joy-Con held as a bat handle: its long axis becomes the bat's long axis.
  return { x: -gy, y: -gz, z: -gx };
}

function applyMotion(gx, gy, gz, dtSec){
  var m = axisMap(gx, gy, gz);
  // deg/sec -> rad for this step
  var wx = m.x * Math.PI/180 * dtSec * MOTION_GAIN;
  var wy = m.y * Math.PI/180 * dtSec * MOTION_GAIN;
  var wz = m.z * Math.PI/180 * dtSec * MOTION_GAIN;
  var mag = Math.sqrt(wx*wx + wy*wy + wz*wz);
  if (mag < 1e-6) return;
  tmpAxis.set(wx/mag, wy/mag, wz/mag);
  tmpQuat.setFromAxisAngle(tmpAxis, mag);
  motionQuat.multiply(tmpQuat);
  motionQuat.normalize();
  batState.liveMotion = true;
  batState.lastMotionAt = performance.now();
}

function recenterBat(){
  motionQuat.identity();
}

  batPivot.rotation.set(0, 0, 0);
  batGroup.rotation.set(0, 0, side * 0.5);
  batPivot.rotation.y = side * 0.35;
  // Camera shifts to the opposite side so the bat doesn't block the pitch
  BATTER_CAM_POS.set(-side * 2.2, 5.6, 19);

function updateBat(now){
  var side = batState.hand === 'right' ? -1 : 1;

  // Live mode: bat mirrors the Joy-Con's integrated orientation directly.
  if (batState.liveMotion && (now - batState.lastMotionAt) < 700){
    restQuat.setFromEuler(new THREE.Euler(0, 0, side * 0.5));
    batGroup.quaternion.copy(restQuat).multiply(motionQuat);
    batPivot.rotation.y = side * 0.35;
    return;
  }

  // Fallback: scripted arc, used when the bridge isn't streaming motion.
  if (batState.swinging){
    var t = (now - batState.swingStart) / batState.swingDur;
    if (t >= 1){
      batState.swinging = false;
      batGroup.rotation.set(0, 0, side * 0.5);
      batPivot.rotation.y = side * 0.35;
    } else {
      var e = 1 - Math.pow(1 - t, 3);
      batGroup.rotation.set(0, 0, side * (0.5 - e * 2.6));
      batPivot.rotation.y = side * (0.35 - e * 2.2);
    }
  } else {
    var w = Math.sin(now * 0.0022) * 0.05;
    batGroup.rotation.set(0, 0, side * (0.5 + w));
    batPivot.rotation.y = side * (0.35 + w * 0.4);
  }
}

/* =========================================================================
   HUD — pitch location grid + swing timing bar
   ========================================================================= */
var hudZoneCtx = document.getElementById('hud-zone').getContext('2d');
var hudTimingCtx = document.getElementById('hud-timing').getContext('2d');
var hudTimingText = document.getElementById('hud-timing-text');
var hudLast = { zone:null, point:null, offsetMs:null, halfWindow:null, whiff:false };

function drawHudZone(){
  var ctx = hudZoneCtx, S = 132, pad = 14, gw = S - pad*2;
  // Grid is drawn with the real zone aspect ratio (17in-ish wide, ~22in tall)
  var gh = gw * (ZONE_H_FT / ZONE_W_FT);
  var topPad = (S - gh) / 2;
  var cw = gw/3, ch = gh/3;
  ctx.clearRect(0, 0, S, S);
  ctx.fillStyle = 'rgba(255,255,255,0.04)';
  ctx.fillRect(pad, topPad, gw, gh);
  ctx.strokeStyle = 'rgba(245,241,232,0.45)';
  ctx.lineWidth = 1;
  for (var i = 0; i <= 3; i++){
    ctx.beginPath(); ctx.moveTo(pad + i*cw, topPad); ctx.lineTo(pad + i*cw, topPad + gh); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(pad, topPad + i*ch); ctx.lineTo(pad + gw, topPad + i*ch); ctx.stroke();
  }
  if (hudLast.zone){
    ctx.fillStyle = 'rgba(250,199,117,0.16)';
    ctx.fillRect(pad + hudLast.zone.col*cw, topPad + hudLast.zone.row*ch, cw, ch);
  }
  if (hudLast.point){
    // Map the true world-space location into grid pixels. +X is screen-right
    // from the camera's viewpoint, matching the 3D scene without mirroring.
    var nx = (hudLast.point.x + ZONE_W_FT/2) / ZONE_W_FT;
    var ny = (ZONE_TOP_FT - hudLast.point.y) / ZONE_H_FT;
    var px = pad + nx * gw;
    var py = topPad + ny * gh;
    // Ball drawn to scale against the zone
    var rpx = (BALL_RADIUS_FT / ZONE_W_FT) * gw;
    ctx.beginPath();
    ctx.arc(px, py, Math.max(4, rpx), 0, Math.PI*2);
    ctx.fillStyle = hudLast.whiff ? '#E24B4A' : '#FCFAF4';
    ctx.fill();
    ctx.strokeStyle = '#C1272D'; ctx.lineWidth = 1.4; ctx.stroke();
  }
}

function drawHudTiming(){
  var ctx = hudTimingCtx, W = 230, H = 56, midY = 30, barX = 10, barW = W - 20;
  ctx.clearRect(0, 0, W, H);
  // Zones: red (early) | amber | green (perfect) | amber | red (late)
  var stops = [
    ['rgba(226,75,74,0.55)', 0.00, 0.18],
    ['rgba(239,159,39,0.55)', 0.18, 0.38],
    ['rgba(143,191,92,0.65)', 0.38, 0.62],
    ['rgba(239,159,39,0.55)', 0.62, 0.82],
    ['rgba(226,75,74,0.55)', 0.82, 1.00]
  ];
  stops.forEach(function(s){
    ctx.fillStyle = s[0];
    ctx.fillRect(barX + barW*s[1], midY - 9, barW*(s[2]-s[1]), 18);
  });
  ctx.strokeStyle = 'rgba(245,241,232,0.5)';
  ctx.lineWidth = 1;
  ctx.strokeRect(barX, midY - 9, barW, 18);
  // Center (perfect timing) tick
  ctx.beginPath();
  ctx.moveTo(barX + barW/2, midY - 13); ctx.lineTo(barX + barW/2, midY + 13);
  ctx.strokeStyle = '#F5F1E8'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#7E7361'; ctx.font = '9px Oswald, sans-serif';
  ctx.textAlign = 'left'; ctx.fillText('EARLY', barX, 12);
  ctx.textAlign = 'right'; ctx.fillText('LATE', barX + barW, 12);

  if (hudLast.offsetMs !== null){
    // Map offset onto the bar; anything past the window pins to the edge.
    var half = hudLast.halfWindow || 1;
    var norm = Math.max(-1.35, Math.min(1.35, hudLast.offsetMs / half));
    var px = barX + barW/2 + (norm / 1.35) * (barW/2);
    ctx.beginPath();
    ctx.moveTo(px, midY - 15);
    ctx.lineTo(px - 5, midY - 24);
    ctx.lineTo(px + 5, midY - 24);
    ctx.closePath();
    ctx.fillStyle = hudLast.whiff ? '#E24B4A' : '#FAC775';
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(px, midY - 12); ctx.lineTo(px, midY + 12);
    ctx.strokeStyle = hudLast.whiff ? '#E24B4A' : '#FAC775';
    ctx.lineWidth = 2.5; ctx.stroke();
  }
}

function updateHud(zone, offsetMs, halfWindow, whiff, point){
  hudLast.zone = zone;
  hudLast.point = point || null;
  hudLast.offsetMs = offsetMs;
  hudLast.halfWindow = halfWindow;
  hudLast.whiff = whiff;
  drawHudZone();
  drawHudTiming();
  if (offsetMs === null){
    hudTimingText.textContent = '—';
  } else {
    var dir = offsetMs < 0 ? 'early' : 'late';
    hudTimingText.textContent = Math.abs(Math.round(offsetMs)) + ' ms ' + dir + (whiff ? ' — whiff' : '');
  }
}

function noiseBuffer(durationSec){
  var bufferSize = audioCtx.sampleRate * durationSec;
  var buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  var data = buffer.getChannelData(0);
  for (var i = 0; i < bufferSize; i++){ data[i] = Math.random() * 2 - 1; }
  return buffer;
}

function playContact(powerPct){
  if (!soundEnabled || !audioCtx) return;
  var src = audioCtx.createBufferSource();
  src.buffer = noiseBuffer(0.25);
  var filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.setValueAtTime(1800, audioCtx.currentTime);
  filter.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.22);
  filter.Q.value = 1.2;
  var gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
  src.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
  src.start();
}

function playWhiff(powerPct){
  if (!soundEnabled || !audioCtx) return;
  var power = Math.max(0, Math.min(1, powerPct / 100));
  var src = audioCtx.createBufferSource();
  src.buffer = noiseBuffer(0.08);
  var filter = audioCtx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 800 + power * 2500;
  filter.Q.value = 0.8;
  var noiseGain = audioCtx.createGain();
  noiseGain.gain.setValueAtTime(0.5 + power * 0.5, audioCtx.currentTime);
  noiseGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.09);
  src.connect(filter); filter.connect(noiseGain); noiseGain.connect(audioCtx.destination);
  src.start();
  var osc = audioCtx.createOscillator();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(120 + power * 100, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.15);
  var oscGain = audioCtx.createGain();
  oscGain.gain.setValueAtTime(0.4 + power * 0.4, audioCtx.currentTime);
  oscGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
  osc.connect(oscGain); oscGain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + 0.2);
}

function normalizePower(peakGyro){
  var span = CALIB_CEIL - CALIB_FLOOR;
  return Math.max(0, Math.min(1, (peakGyro - CALIB_FLOOR) / span));
}

function scoreSwing(offsetMs, peakGyro, zone){
  var baseWindow = PRESETS[state.preset].window;
  var half = (baseWindow * zone.windowMult) / 2;
  if (Math.abs(offsetMs) > half){
    return {outcome:'WHIFF', timingQ:0, power:null};
  }
  var timingQ = 1 - (Math.abs(offsetMs) / half);
  var power = normalizePower(peakGyro);
  var tier;
  if (timingQ > 0.85 && power > 0.8){ tier = 'SWEET SPOT'; }
  else if (power * (0.5+0.5*timingQ) > 0.5){ tier = 'SOLID CONTACT'; }
  else { tier = 'WEAK CONTACT'; }
  return {outcome:tier, timingQ:Math.round(timingQ*100), power:Math.round(power*100), timingQRaw:timingQ, powerRaw:power};
}

/* =========================================================================
   PITCH SIMULATION — the pitch now flies under the same drag/gravity/Magnus
   model as a batted ball, so it actually drops on the way in. An aim solver
   corrects the release vector over a few iterations so the pitch still
   arrives at the intended spot in the zone despite that drop.
   ========================================================================= */
function integratePitch(dirX, dirY, dirZ, speedMph, spinRpm){
  var v0 = speedMph * 0.44704;
  var len = Math.sqrt(dirX*dirX + dirY*dirY + dirZ*dirZ) || 1;
  var vel = { x: v0*dirX/len, y: v0*dirY/len, z: v0*dirZ/len };
  var pos = { x: RELEASE_X*M_PER_FT, y: RELEASE_Y*M_PER_FT, z: RELEASE_Z*M_PER_FT };
  var omega = spinRpm * 2 * Math.PI / 60;
  var pts = [{ t:0, x:RELEASE_X, y:RELEASE_Y, z:RELEASE_Z }];
  var t = 0;
  var plateZM = PLATE_Z * M_PER_FT;
  var crossing = null;

  for (var i = 0; i < 900; i++){
    var speed = Math.sqrt(vel.x*vel.x + vel.y*vel.y + vel.z*vel.z) || 0.01;
    var dragCoeff = 0.5 * AIR_DENSITY * DRAG_CD * BALL_AREA * speed / BALL_MASS_KG;
    var ax = -dragCoeff * vel.x;
    var ay = -dragCoeff * vel.y - GRAVITY;
    var az = -dragCoeff * vel.z;
    // Backspin on a four-seamer offsets some of the gravity drop
    var spinFactor = (BALL_RADIUS_M * omega) / speed;
    var liftCoeff = spinFactor > 0 ? 1 / (2 + 1/spinFactor) : 0;
    ay += ((0.5 * AIR_DENSITY * liftCoeff * BALL_AREA * speed * speed) / BALL_MASS_KG) * 0.55;

    var prev = { x:pos.x, y:pos.y, z:pos.z };
    vel.x += ax*DT; vel.y += ay*DT; vel.z += az*DT;
    pos.x += vel.x*DT; pos.y += vel.y*DT; pos.z += vel.z*DT;
    t += DT;
    pts.push({ t:t, x:pos.x*FT_PER_M, y:pos.y*FT_PER_M, z:pos.z*FT_PER_M });

    if (crossing === null && prev.z < plateZM && pos.z >= plateZM){
      var f = (plateZM - prev.z) / (pos.z - prev.z);
      crossing = {
        t: t - DT*(1-f),
        x: (prev.x + (pos.x-prev.x)*f) * FT_PER_M,
        y: (prev.y + (pos.y-prev.y)*f) * FT_PER_M
      };
    }
    if (pos.z > (PLATE_Z + 14) * M_PER_FT) break;
    if (pos.y < 0) break;
  }
  return { points: pts, crossing: crossing };
}

function simulatePitch(target, speedMph){
  var spinRpm = 2100 + Math.random()*350;
  // Seed the aim above the target by roughly the expected gravity drop —
  // aiming straight at the target puts the pitch in the dirt before it ever
  // reaches the plate, and the solver would have nothing to correct from.
  var distFt = Math.abs(PLATE_Z - RELEASE_Z);
  var tEst = distFt / (speedMph * 1.46667);
  var aim = { x: target.x, y: target.y + 0.5 * 32.174 * tEst * tEst * 0.72 };
  var sim = null;
  // Iteratively correct the aim point until the ball's plate crossing lands
  // on the intended target.
  for (var k = 0; k < 8; k++){
    sim = integratePitch(aim.x - RELEASE_X, aim.y - RELEASE_Y, PLATE_Z - RELEASE_Z, speedMph, spinRpm);
    if (!sim.crossing){ aim.y += 2.0; continue; }
    var ex = target.x - sim.crossing.x;
    var ey = target.y - sim.crossing.y;
    if (Math.abs(ex) < 0.005 && Math.abs(ey) < 0.005) break;
    aim.x += ex; aim.y += ey;
  }
  var flightSec = sim && sim.crossing ? sim.crossing.t : (Math.abs(PLATE_Z - RELEASE_Z) / (speedMph * 1.46667));
  return { points: sim ? sim.points : [], flightSec: flightSec, spinRpm: spinRpm };
}

function pitchPositionAt(plan, tSec){
  var pts = plan.points;
  if (!pts.length) return null;
  if (tSec <= 0) return pts[0];
  var last = pts[pts.length-1];
  if (tSec >= last.t) return last;
  for (var i = 1; i < pts.length; i++){
    if (pts[i].t >= tSec){
      var a = pts[i-1], b = pts[i];
      var span = b.t - a.t;
      var f = span > 0 ? (tSec - a.t) / span : 0;
      return { x: a.x + (b.x-a.x)*f, y: a.y + (b.y-a.y)*f, z: a.z + (b.z-a.z)*f };
    }
  }
  return last;
}

function ballPositionAt(elapsedMs, zone){
  // Kept for compatibility; the live path now comes from state.pitchPlan.
  var plan = state.pitchPlan;
  if (!plan) return { x:0, y:ZONE_CENTER_Y, z:MOUND_Z, visible:false };
  var tSec = (elapsedMs - state.windupMs) / 1000;
  if (tSec < 0) return { x:RELEASE_X, y:RELEASE_Y, z:RELEASE_Z, visible:false };
  var p = pitchPositionAt(plan, tSec);
  if (!p) return { x:0, y:ZONE_CENTER_Y, z:MOUND_Z, visible:false };
  return { x:p.x, y:p.y, z:p.z, visible: p.z < PLATE_Z + 9 && p.y > 0.05 };
}

function classifyBattedBall(launchAngleDeg){
  if (launchAngleDeg < 10) return 'GROUND BALL';
  if (launchAngleDeg < 25) return 'LINE DRIVE';
  if (launchAngleDeg < 50) return 'FLY BALL';
  return 'POP UP';
}

/* =========================================================================
   LAUNCH — physics playback with trail, bounces, dust, wall carom
   ========================================================================= */
var activeLaunch = null;

function playLaunchArc(result, offsetMs, zone, contactPoint){
  // Contact happens wherever the ball actually was when the swing landed,
  // sampled off the live pitch trajectory — not at the zone cell's center.
  var target = contactPoint || zoneWorldPos(zone);

  var exitVeloMph = 60 + result.powerRaw * 55;
  exitVeloMph *= (0.85 + 0.15 * result.timingQRaw);

  var idealAngle = 25;
  var rowNudge = zone.row === 0 ? 5 : (zone.row === 2 ? -4 : 0);
  var missSeverity = 1 - result.timingQRaw;
  var missDirection = offsetMs < 0 ? -1 : 1;
  var timingShift = missDirection * missSeverity * 34;
  var jitter = (Math.random() - 0.5) * 6;
  var launchAngleDeg = Math.max(-10, Math.min(60, idealAngle + rowNudge + timingShift + jitter));

  var colSpray = (zone.col - 1) * 16;
  var timingSpray = -offsetMs * 0.05 * (1 + missSeverity);
  var sprayAngleDeg = Math.max(-60, Math.min(60, colSpray + timingSpray + (Math.random()-0.5)*6));
  var isFoul = Math.abs(sprayAngleDeg) > 45;

  var backspinRpm = 1800 + result.powerRaw * 800 + (Math.random()-0.5)*200;

  var traj = simulateTrajectory(exitVeloMph, launchAngleDeg, sprayAngleDeg, backspinRpm, target.y);
  traj.battedBallType = classifyBattedBall(launchAngleDeg);
  traj.isFoul = isFoul;
  traj.exitVeloMph = Math.round(exitVeloMph);
  traj.launchAngleDeg = Math.round(launchAngleDeg);
  traj.sprayAngleDeg = Math.round(sprayAngleDeg);
  if (isFoul) traj.clearsWall = false;

  hitBall.position.set(target.x, target.y, target.z);
  hitBall.visible = true;
  resetTrail();
  triggerFlash(target.x, target.y, target.z, result.powerRaw);

  state.hitting = true;
  state.cameraMode = 'chase';

  activeLaunch = {
    traj: traj,
    target: target,
    start: performance.now(),
    nextBounce: 0,
    wallSoundPlayed: false,
    holdUntil: null
  };
  return traj;
}

/* =========================================================================
   MAIN LOOP
   ========================================================================= */
function animate(){
  requestAnimationFrame(animate);
  var now = performance.now();

  // Pitch flight
  if (state.pitching){
    var elapsed = now - state.pitchStartLocal;
    var pos = ballPositionAt(elapsed, state.currentZone);
    ball.position.set(pos.x, pos.y, pos.z);
    ball.visible = pos.visible;
    ball.rotation.x += 0.35;
    if (elapsed >= state.travelMs){
      state.pitching = false;
      ball.visible = false;
    }
  }

  // Batted ball playback
  if (activeLaunch){
    var L = activeLaunch;
    var tSec = (now - L.start) / 1000;
    var endT = L.traj.points[L.traj.points.length-1].t;
    var p = positionOnTrajectory(L.traj, tSec);
    var wx = L.target.x + p.x, wy = p.y, wz = L.target.z + p.z;
    hitBall.position.set(wx, wy, wz);
    hitBall.rotation.x += 0.45;
    hitBall.rotation.z += 0.2;

    if (tSec < endT) pushTrail(wx, wy, wz);

    // Fire bounce dust/sound as their timestamps pass
    while (L.nextBounce < L.traj.bounceEvents.length && L.traj.bounceEvents[L.nextBounce].t <= tSec){
      var be = L.traj.bounceEvents[L.nextBounce];
      spawnDust(L.target.x + be.x, 0, L.target.z + be.z, be.strength);
      playBounce(be.strength);
      L.nextBounce++;
    }
    if (!L.wallSoundPlayed && L.traj.wallHitPoint && tSec >= L.traj.wallHitPoint.t){
      playWallThud();
      L.wallSoundPlayed = true;
    }

    if (tSec < endT){
      var pNext = positionOnTrajectory(L.traj, Math.min(endT, tSec + 0.05));
      var velDir = new THREE.Vector3(pNext.x - p.x, pNext.y - p.y, pNext.z - p.z);
      if (velDir.lengthSq() < 0.0001) velDir.set(0, -0.1, -1);
      velDir.normalize();
      updateCameraChase(new THREE.Vector3(wx, wy, wz), velDir);
    } else {
      if (L.holdUntil === null) L.holdUntil = now + 1500;
      if (now >= L.holdUntil){
        hitBall.visible = false;
        resetTrail();
        state.hitting = false;
        state.cameraMode = 'batter';
        activeLaunch = null;
      }
    }
  }

  if (state.cameraMode === 'batter' && !activeLaunch){
    updateCameraBatter();
  }

  // Flash decay
  if (flashSprite.visible){
    var fa = (now - flashStart) / 260;
    if (fa >= 1){ flashSprite.visible = false; }
    else {
      flashSprite.material.opacity = 1 - fa;
      flashSprite.scale.setScalar(flashSprite.scale.x * 1.03);
    }
  }

  updateBat(now);
  updateDust(now);
  sky.position.copy(camera.position);
  renderer.render(scene, camera);
}

/* =========================================================================
   RESULT HANDLING
   ========================================================================= */
function showResult(peakGyro, offsetMs){
  state.pitching = false;

  var contactTimeSec = (state.idealContactMs + (offsetMs === 999999 ? 0 : offsetMs) - state.windupMs) / 1000;
  var cp = state.pitchPlan ? pitchPositionAt(state.pitchPlan, Math.max(0, contactTimeSec)) : null;
  var contactPoint = cp ? { x:cp.x, y:Math.max(0.6, cp.y), z:cp.z } : zoneWorldPos(state.currentZone);

  var swingElapsedMs = (offsetMs === 999999) ? state.travelMs : (state.idealContactMs + offsetMs);
  var pos = ballPositionAt(swingElapsedMs, state.currentZone);
  ball.position.set(pos.x, pos.y, pos.z);

  var result = scoreSwing(offsetMs, peakGyro, state.currentZone);
  var halfWindow = (PRESETS[state.preset].window * state.currentZone.windowMult) / 2;
  outcomeLabel.textContent = result.outcome;
  outcomeLabel.style.color = result.outcome === 'WHIFF' ? '#E24B4A' : (result.outcome === 'SWEET SPOT' ? '#8FBF5C' : '#8A7D6B');
  var zoneNote = state.currentZone.tier + ' pitch';

  triggerBatSwing();
  updateHud(state.currentZone, offsetMs === 999999 ? null : offsetMs, halfWindow,
            result.outcome === 'WHIFF', state.pitchTarget);

  if (result.outcome === 'WHIFF'){
    distanceReadout.textContent = 'Whiff';
    distanceReadout.style.color = '#E24B4A';
    detailLabel.textContent = (offsetMs > 0 ? 'swung too late' : 'swung too early') + ' — ' + zoneNote + ' (peak ' + Math.round(peakGyro) + ' dps)';
    playWhiff(0);
    // Let the pitch keep travelling to the catcher rather than disappearing
    // at the moment of the miss — an early swing should still see the ball
    // finish its trip through the zone.
    state.pitching = true;
    return;
  }

  ball.visible = false;
  playContact(result.power);
  var traj = playLaunchArc(result, offsetMs, state.currentZone, contactPoint);

  var label;
  if (traj.isFoul){ label = 'FOUL BALL'; }
  else if (traj.clearsWall){ label = 'HOME RUN!'; }
  else if (traj.hitWall){ label = 'OFF THE WALL'; }
  else if (traj.battedBallType === 'GROUND BALL'){ label = 'GROUND OUT'; }
  else if (traj.battedBallType === 'POP UP'){ label = 'POP OUT'; }
  else { label = traj.battedBallType + ' OUT'; }

  distanceReadout.textContent = traj.carryFt + ' ft';
  distanceReadout.style.color = traj.clearsWall ? '#8FBF5C' : (traj.isFoul ? '#E24B4A' : '#FAC775');
  detailLabel.textContent = label + ' — ' + traj.exitVeloMph + ' mph exit, ' + traj.launchAngleDeg + '° launch, ' +
    traj.bounces + ' bounce' + (traj.bounces === 1 ? '' : 's') + ', ' + traj.totalDistanceFt + ' ft w/ roll';
  updateScoreboard(traj.carryFt + ' FT', label);

  if (traj.carryFt > sessionBestFt){
    sessionBestFt = traj.carryFt;
    sessionBestEl.textContent = sessionBestFt + ' ft';
  }
  if (traj.clearsWall){
    sessionHRs++;
    sessionHrsEl.textContent = sessionHRs;
  }

  // TODO(playin/derby backend): POST to /playin/derby/api/runs
  // { carry_ft, total_distance_ft, exit_velo, launch_angle, spray_angle,
  //   batted_ball_type, is_foul, bounces, cleared_wall, hit_wall,
  //   zone_id, outcome, power_pct, timing_pct, offset_ms }
}

/* =========================================================================
   WEBSOCKET
   ========================================================================= */
var ws = new WebSocket('ws://localhost:8765');
ws.onopen = function(){
  statusEl.textContent = 'Connected — tap ZR on the right joy-con to call for a pitch';
  ws.send(JSON.stringify({type:'set_difficulty', speed_mph:PRESETS[state.preset].speed}));
};
ws.onclose = function(){ statusEl.textContent = 'Disconnected — is derby_bridge_server.py running?'; };
ws.onerror = function(){ statusEl.textContent = 'Connection error — is derby_bridge_server.py running?'; };

var lastMotionTs = 0;
ws.onmessage = function(evt){
  var msg = JSON.parse(evt.data);
  if (msg.type === 'motion'){
    var nowM = performance.now();
    var dt = lastMotionTs ? Math.min(0.05, (nowM - lastMotionTs) / 1000) : 1/60;
    lastMotionTs = nowM;
    applyMotion(msg.gx, msg.gy, msg.gz, dt);
    return;
  }
  if (msg.type === 'pitch_start'){
    // Client-side double-tap guard mirroring the bridge server's. If a pitch
    // is still in the air or a batted ball is being played out, ignore the
    // new pitch rather than snapping the scene back to a fresh windup.
    if (state.pitching || activeLaunch) return;
    state.currentZone = pickZone();
    state.pitchTarget = zoneTargetPoint(state.currentZone);
    var speedMph = PRESETS[state.preset].speed;
    state.pitchPlan = simulatePitch(state.pitchTarget, speedMph);
    // The server's ideal-contact timing covers windup + flight. Now that the
    // flight is a real simulation with a real duration, the remainder is the
    // windup — the ball stays hidden in the pitcher's hand until release.
    state.windupMs = Math.max(120, state.idealContactMs - state.pitchPlan.flightSec * 1000);
    highlightZone(state.currentZone);
    state.pitching = true;
    state.cameraMode = 'batter';
    state.pitchStartLocal = performance.now();
    // Zero out accumulated gyro drift so every pitch starts from the stance.
    recenterBat();
    activeLaunch = null;
    resetTrail();
    ball.visible = false;
    hitBall.visible = false;
    outcomeLabel.textContent = 'Pitch incoming';
    outcomeLabel.style.color = '#8A7D6B';
    distanceReadout.textContent = '---';
    distanceReadout.style.color = '#FAC775';
    detailLabel.textContent = state.currentZone.tier + ' pitch — swing when ready';
    updateHud(state.currentZone, null, null, false, state.pitchTarget);
  } else if (msg.type === 'result'){
    if (msg.offset_ms === 999999){ showResult(0, 999999); }
    else { showResult(msg.peak_gyro, msg.offset_ms); }
  }
};

resizeRenderer();
highlightZone(state.currentZone);
animate();

document.getElementById('btn-fullscreen').onclick = function(){
  if (!document.fullscreenElement){ document.documentElement.requestFullscreen().catch(function(){}); }
  else { document.exitFullscreen(); }
};
document.addEventListener('fullscreenchange', function(){
  document.body.classList.toggle('fs-mode', !!document.fullscreenElement);
  setTimeout(resizeRenderer, 60);
});
</script>
